name: Deploy RAG Assistant to HuggingFace

on:
  push:
    branches: [ master, main ]
    # Only run this action when files inside the RAG folder change
    paths:
      - 'rag_pdf_assistant/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Clone the empty huggingface space
          git clone https://user:$HF_TOKEN@huggingface.co/spaces/manojlabs/rag-pdf-assistant temp_space
          
          # Copy our RAG app files into the space
          cp -r rag_pdf_assistant/* temp_space/
          
          # Create the HuggingFace configuration README
          echo "---" > temp_space/README.md
          echo "title: Rag Pdf Assistant" >> temp_space/README.md
          echo "emoji: 📄" >> temp_space/README.md
          echo "colorFrom: blue" >> temp_space/README.md
          echo "colorTo: indigo" >> temp_space/README.md
          echo "sdk: gradio" >> temp_space/README.md
          echo "sdk_version: \"5.7.1\"" >> temp_space/README.md
          echo "app_file: app.py" >> temp_space/README.md
          echo "pinned: false" >> temp_space/README.md
          echo "---" >> temp_space/README.md
          
          echo "" >> temp_space/README.md
          cat rag_pdf_assistant/README.md >> temp_space/README.md
          
          cd temp_space
          
          # HuggingFace specifically looks for a file named app.py to start
          mv rag_pdf_assistant.py app.py
          
          # Push the changes to HuggingFace
          git add .
          git commit -m "Auto-deploy from GitHub Actions" || echo "No changes to commit"
          git push
